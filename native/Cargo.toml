# The Rust side of mtgcalc (ADR-0009, ADR-0011, ADR-0013): one pure core and two bindings.
[workspace]
members = ["core", "python", "wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
mtgcalc-core = { path = "core" }
num-bigint = "0.4"   # PyO3 0.30 only converts num-bigint 0.4.x (see .github/dependabot.yml)
num-integer = "0.1"
num-traits = "0.2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Counts are validated to fit u16/u32 at the API boundary (see engine::Query::validate),
# so the narrowing casts inside the hot loops are lossless by construction.
cast_possible_truncation = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
