[package]
name = "mtgcalc-native"
version = "0.5.0"
description = "Native exact engine for mtgcalc: the PyO3 extension module mtgcalc_native"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mtgcalc_native"
crate-type = ["cdylib"]

[dependencies]
mtgcalc-core = { workspace = true, features = ["json"] }
num-bigint.workspace = true
pyo3 = { version = "0.30", features = ["num-bigint", "abi3-py312"] }

[lints]
workspace = true
