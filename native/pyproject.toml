[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "mtgcalc-native"
version = "0.5.0"
description = "Optional native (Rust) exact engine for mtgcalc"
requires-python = ">=3.12"

[tool.maturin]
# The extension lives in the `python` crate of the workspace (ADR-0013 §1).
manifest-path = "python/Cargo.toml"
features = ["pyo3/extension-module"]
module-name = "mtgcalc_native"
