[package]
name = "mtgcalc-wasm"
version = "0.1.0"
description = "WebAssembly bindings of the mtgcalc core for the web app (ADR-0013)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mtgcalc-core = { workspace = true, features = ["json"] }
# Must equal the wasm-bindgen CLI version used by web/scripts/build-wasm.mjs.
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
