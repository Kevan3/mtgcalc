# Quality gates from docs/05-engineering-process.md §3. Every job must pass to merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, doc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --check
      # The core and the browser bindings (no Python needed), with and without the JSON boundary.
      - run: cargo clippy --release --all-targets --workspace --exclude mtgcalc-native -- -D warnings
      - run: cargo clippy --release --all-targets -p mtgcalc-core --all-features -- -D warnings
      - run: cargo clippy --release --target wasm32-unknown-unknown -p mtgcalc-wasm -- -D warnings
      - uses: actions/setup-python@v7  # the PyO3 bindings need a Python to build against
        with:
          python-version: "3.12"
      - run: cargo clippy --release -p mtgcalc-native -- -D warnings
      - run: cargo test --release --workspace --exclude mtgcalc-native --all-features
      - run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  lint:
    name: Python (ruff, mypy, import contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install (with the native engine, so its type stubs are checked too)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ./native
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src tests
      - run: lint-imports

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.engine }} engine)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        engine: [native, python]
    env:
      MTGCALC_ENGINE: ${{ matrix.engine == 'python' && 'python' || 'auto' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.engine == 'native'
      - uses: Swatinem/rust-cache@v2
        if: matrix.engine == 'native'
        with:
          workspaces: native
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install the native engine
        if: matrix.engine == 'native'
        run: python -m pip install ./native
      - name: Check which engine is active
        run: python -c "from mtgcalc.engine.select import default_engine as d; print(type(d()).__name__)"
      - name: Tests (GUI tests use a virtual display)
        run: xvfb-run --auto-servernum python -m pytest -q --cov --cov-report=term-missing:skip-covered

  web:
    name: Web app (WebAssembly build, lint, unit and end-to-end tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # Must equal the wasm-bindgen crate version (native/wasm/Cargo.toml); the build checks it.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run wasm
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npx vite build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
