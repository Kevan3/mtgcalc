# Quality gates from docs/05-engineering-process.md §3. Every job must pass to merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, doc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - uses: actions/setup-python@v5  # the PyO3 bindings need a Python to build against
        with:
          python-version: "3.12"
      - run: cargo clippy --release --features python -- -D warnings
      - run: cargo test --release
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  lint:
    name: Python (ruff, mypy, import contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install (with the native engine, so its type stubs are checked too)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ./native
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src tests
      - run: lint-imports

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.engine }} engine)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        engine: [native, python]
    env:
      MTGCALC_ENGINE: ${{ matrix.engine == 'python' && 'python' || 'auto' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.engine == 'native'
      - uses: Swatinem/rust-cache@v2
        if: matrix.engine == 'native'
        with:
          workspaces: native
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install the native engine
        if: matrix.engine == 'native'
        run: python -m pip install ./native
      - name: Check which engine is active
        run: python -c "from mtgcalc.engine.select import default_engine as d; print(type(d()).__name__)"
      - name: Tests (GUI tests use a virtual display)
        run: xvfb-run --auto-servernum python -m pytest -q --cov --cov-report=term-missing:skip-covered
