# Weekly update PRs for CI actions, the Rust workspace, Python and the web app.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    ignore:
      # PyO3 converts big integers with num-bigint 0.4.x only (pyo3 0.30 depends on
      # "0.4.4"). Moving our crate to 0.5 would make its BigUint a different type from the
      # one PyO3 converts. Remove this once PyO3 supports num-bigint 0.5.
      - dependency-name: num-bigint
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript < 6.1; move on when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      web-dev:
        dependency-type: development
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
